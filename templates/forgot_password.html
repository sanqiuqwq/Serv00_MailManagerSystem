{% extends "base.html" %}

{% block title %}忘记密码 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card card-line spotlight rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="icon-tile !w-14 !h-14 !rounded-2xl mx-auto mb-5 bg-gradient-to-br from-amber-400 to-orange-600 text-xl">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">找回密码</h1>
            <p class="text-sm text-slate-400">输入注册邮箱以接收重置链接</p>
        </div>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">邮箱地址</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="email" class="form-input !pl-10" name="email" required placeholder="your@email.com">
                </div>
            </div>

            {% if recaptcha_enabled and recaptcha_site_key %}
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
            </div>
            {% endif %}

            <button type="submit" class="btn-primary w-full !py-3">
                <i class="fas fa-paper-plane"></i>发送重置链接
            </button>
        </form>

        <div class="mt-7 pt-6 border-t border-white/10 text-center">
            <p class="text-sm text-slate-500">
                <a href="{{ url_for('login') }}" class="text-indigo-300 hover:text-white font-semibold transition">
                    <i class="fas fa-arrow-left mr-1"></i>返回登录
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
