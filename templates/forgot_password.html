{% extends "base.html" %}

{% block title %}忘记密码 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card rounded-3xl p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white text-3xl">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">找回密码</h1>
            <p class="text-slate-600">输入邮箱以接收重置链接</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-envelope mr-2 text-amber-600"></i>邮箱地址
                </label>
                <input type="email" class="form-input" name="email" required placeholder="your@email.com">
            </div>

            {% if recaptcha_enabled and recaptcha_site_key %}
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
            </div>
            {% endif %}
            
            <button type="submit" class="btn-primary w-full text-base">
                <i class="fas fa-paper-plane"></i>发送重置链接
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-600">
                <a href="{{ url_for('login') }}" class="text-indigo-600 hover:text-indigo-800 font-semibold">
                    <i class="fas fa-arrow-left mr-1"></i>返回登录
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
