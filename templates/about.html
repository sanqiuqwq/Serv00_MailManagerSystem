{% extends "base.html" %}

{% block title %}关于 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-3xl mx-auto">
    <div class="glass-card rounded-3xl p-8 md:p-12">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-white text-2xl">
                <i class="fas fa-info-circle"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800">关于我们</h1>
        </div>
        <div class="prose prose-slate max-w-none text-slate-700 leading-relaxed">
            {{ about_page.content|safe }}
        </div>
    </div>
</div>
{% endblock %}
