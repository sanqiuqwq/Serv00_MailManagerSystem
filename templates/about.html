{% extends "base.html" %}

{% block title %}关于 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-3xl mx-auto">
    <div class="glass-card card-line rounded-3xl p-7 md:p-12">
        <div class="flex items-center gap-4 mb-8">
            <span class="icon-tile !w-12 !h-12 !rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 text-lg">
                <i class="fas fa-circle-info"></i>
            </span>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">关于我们</h1>
                <p class="text-sm text-slate-500 mt-0.5">{{ site_settings.site_name }}</p>
            </div>
        </div>
        <div class="divider mb-8"></div>
        <div class="prose max-w-none">
            {{ about_page.content|safe }}
        </div>
    </div>
</div>
{% endblock %}
