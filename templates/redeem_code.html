{% extends "base.html" %}

{% block title %}卡密兑换 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card card-line spotlight rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="icon-tile !w-14 !h-14 !rounded-2xl mx-auto mb-5 bg-gradient-to-br from-fuchsia-500 to-rose-600 text-xl">
                <i class="fas fa-gift"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">卡密兑换</h1>
            <p class="text-sm text-slate-400">输入卡密以获得额外邮箱配额</p>
        </div>

        {% if site_settings.purchase_code_url %}
        <div class="alert-info mb-6 text-center text-sm">
            <i class="fas fa-shopping-cart mr-2"></i>
            没有卡密？<a href="{{ site_settings.purchase_code_url }}" target="_blank" class="font-semibold underline underline-offset-2">立即购买</a>
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">请输入卡密</label>
                <input type="text" class="form-input font-mono text-center tracking-[0.15em] !py-3.5" name="code" required placeholder="XXXX-XXXX-XXXX-XXXX">
            </div>

            <button type="submit" class="btn-primary w-full !py-3">
                <i class="fas fa-gift"></i>立即兑换
            </button>
        </form>
    </div>
</div>
{% endblock %}
