{% extends "base.html" %}

{% block title %}卡密兑换 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card rounded-3xl p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center text-white text-3xl">
                <i class="fas fa-gift"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">卡密兑换</h1>
            <p class="text-slate-600">输入卡密以获得额外邮箱配额</p>
        </div>

        {% if site_settings.purchase_code_url %}
        <div class="alert-info mb-6 text-center">
            <i class="fas fa-shopping-cart mr-2"></i>
            没有卡密？<a href="{{ site_settings.purchase_code_url }}" target="_blank" class="font-semibold underline">立即购买</a>
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-ticket mr-2 text-pink-600"></i>请输入卡密
                </label>
                <input type="text" class="form-input font-mono text-center" name="code" required placeholder="XXXX-XXXX-XXXX-XXXX">
            </div>
            
            <button type="submit" class="btn-primary w-full text-base">
                <i class="fas fa-gift"></i>立即兑换
            </button>
        </form>
    </div>
</div>
{% endblock %}
