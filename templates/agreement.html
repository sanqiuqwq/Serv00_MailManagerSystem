{% extends "base.html" %}

{% block title %}用户协议 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-3xl mx-auto">
    <div class="glass-card card-line rounded-3xl p-7 md:p-12">
        <div class="flex items-center gap-4 mb-8">
            <span class="icon-tile !w-12 !h-12 !rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-600 text-lg">
                <i class="fas fa-file-contract"></i>
            </span>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">用户协议</h1>
                <p class="text-sm text-slate-500 mt-0.5">请在使用前仔细阅读</p>
            </div>
        </div>
        <div class="divider mb-8"></div>
        <div class="prose max-w-none">
            {{ user_agreement.content|safe }}
        </div>
        <div class="mt-10 pt-6 border-t border-white/10 flex justify-center">
            <a href="{{ url_for('index') }}" class="btn-ghost">
                <i class="fas fa-arrow-left"></i>返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
