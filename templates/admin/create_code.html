{% extends "admin/base.html" %}

{% block title %}创建卡密 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card card-line rounded-3xl p-6 md:p-7 mb-6">
    <div class="flex items-center gap-3.5">
        <span class="icon-tile !w-11 !h-11 !rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600">
            <i class="fas fa-plus"></i>
        </span>
        <div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">创建卡密</h1>
            <p class="text-xs text-slate-500 mt-0.5">生成新的兑换卡密</p>
        </div>
    </div>
</div>

<div data-aos="fade-up" class="glass-card rounded-3xl p-6 md:p-8">
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-3 uppercase tracking-wider">有效期设置</label>
            <div class="flex flex-wrap items-start gap-5">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="is_permanent" value="true" id="permanent" class="w-4 h-4 accent-indigo-500">
                    <span class="text-sm font-medium text-slate-200">永久有效</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="is_permanent" value="false" id="not_permanent" checked class="w-4 h-4 accent-indigo-500">
                    <span class="text-sm font-medium text-slate-200">限时</span>
                </label>
            </div>
        </div>

        <div id="duration_div">
            <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">天数</label>
            <select class="form-select" name="duration">
                <option value="1">1天</option>
                <option value="2">2天</option>
                <option value="3">3天</option>
                <option value="4">4天</option>
                <option value="5">5天</option>
                <option value="6">6天</option>
                <option value="7">7天</option>
                <option value="8">8天</option>
                <option value="9">9天</option>
                <option value="10">10天</option>
                <option value="11">11天</option>
                <option value="12">12天</option>
                <option value="13">13天</option>
                <option value="14">14天</option>
                <option value="15">15天</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">增加邮箱数量</label>
                <input type="number" class="form-input" name="extra_emails" value="1" min="1" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">使用次数（0 为无限）</label>
                <input type="number" class="form-input" name="max_uses" value="1" min="0" required>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">有效期（天，0 为永不过期）</label>
                <input type="number" class="form-input" name="expires_days" value="0" min="0">
                <p class="text-[0.72rem] text-slate-500 mt-2">新增邮箱最大创建次数的有效期</p>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">生成数量</label>
                <input type="number" class="form-input" name="count" value="1" min="1" max="100">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">自定义卡密（可选，单个生成时可用）</label>
            <input type="text" class="form-input" name="custom_code" placeholder="留空则自动生成">
        </div>

        <button type="submit" class="btn-success w-full md:w-auto">
            <i class="fas fa-plus"></i>创建卡密
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const permanentRadio = document.getElementById('permanent');
    const notPermanentRadio = document.getElementById('not_permanent');
    const durationDiv = document.getElementById('duration_div');

    function toggleDuration() {
        durationDiv.style.display = permanentRadio.checked ? 'none' : 'block';
    }

    permanentRadio.addEventListener('change', toggleDuration);
    notPermanentRadio.addEventListener('change', toggleDuration);
});
</script>
{% endblock %}
