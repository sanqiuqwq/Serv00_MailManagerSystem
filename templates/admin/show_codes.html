{% extends "admin/base.html" %}

{% block title %}卡密创建成功 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card card-line rounded-3xl p-6 md:p-8 mb-6">
    <div class="flex items-center gap-4 mb-6">
        <span class="icon-tile !w-12 !h-12 !rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-lg">
            <i class="fas fa-check"></i>
        </span>
        <div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">卡密创建成功</h1>
            <p class="text-xs text-slate-500 mt-0.5">已成功创建 {{ codes|length }} 个卡密</p>
        </div>
    </div>

    <div class="alert-warning mb-6">
        <i class="fas fa-triangle-exclamation mr-2"></i><strong>请复制保存以下卡密，刷新页面后将无法再次查看！</strong>
    </div>

    <div class="code-block p-5 md:p-6">
        <pre class="text-sm whitespace-pre-wrap break-all">{{ codes|join('\n') }}</pre>
    </div>

    <div class="mt-6 flex justify-center">
        <a href="{{ url_for('admin_codes') }}" class="btn-primary">
            <i class="fas fa-arrow-left"></i>返回卡密管理
        </a>
    </div>
</div>
{% endblock %}
