{% extends "admin/base.html" %}

{% block title %}卡密创建成功 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card rounded-3xl p-8 mb-6">
    <div class="flex items-center gap-4 mb-6">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-2xl">
            <i class="fas fa-check"></i>
        </div>
        <div>
            <h1 class="text-3xl font-bold text-slate-800">卡密创建成功！</h1>
            <p class="text-slate-600">已成功创建 {{ codes|length }} 个卡密</p>
        </div>
    </div>

    <div class="alert-warning mb-6">
        <i class="fas fa-exclamation-triangle mr-2"></i><strong>请复制保存以下卡密，刷新页面后将无法再次查看！</strong>
    </div>

    <div class="bg-slate-900 rounded-2xl p-6">
        <pre class="text-emerald-400 font-mono text-sm whitespace-pre-wrap break-all">{{ codes|join('\n') }}</pre>
    </div>

    <div class="mt-6 flex justify-center">
        <a href="{{ url_for('admin_codes') }}" class="btn-primary">
            <i class="fas fa-arrow-left"></i>返回卡密管理
        </a>
    </div>
</div>
{% endblock %}
