{% extends "admin/base.html" %}

{% block title %}站点设置 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card card-line rounded-3xl p-6 md:p-7 mb-6">
    <div class="flex items-center gap-3.5">
        <span class="icon-tile !w-11 !h-11 !rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600">
            <i class="fas fa-gear"></i>
        </span>
        <div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">站点设置</h1>
            <p class="text-xs text-slate-500 mt-0.5">配置系统基本参数</p>
        </div>
    </div>
</div>

<div data-aos="fade-up" class="glass-card rounded-3xl p-6 md:p-8 mb-6">
    <h2 class="section-title mb-6">
        <span class="icon-tile !w-8 !h-8 !rounded-lg bg-emerald-500/15 border-emerald-400/25 text-emerald-300 text-xs"><i class="fas fa-pen"></i></span>
        基本设置
    </h2>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">站点名称</label>
            <input type="text" class="form-input" name="site_name" value="{{ site_settings.site_name }}" required>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">站点描述</label>
            <textarea class="form-textarea" name="site_description" rows="3" required>{{ site_settings.site_description }}</textarea>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">网站域名</label>
            <input type="text" class="form-input" name="site_url" value="{{ site_settings.site_url }}" required>
            <p class="text-[0.72rem] text-slate-500 mt-1.5">例如：https://example.com</p>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">购买卡密链接</label>
            <input type="text" class="form-input" name="purchase_code_url" value="{{ site_settings.purchase_code_url or '' }}">
            <p class="text-[0.72rem] text-slate-500 mt-1.5">留空则不显示购买卡密按钮</p>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">TG 交流群链接</label>
            <input type="text" class="form-input" name="tg_group_url" value="{{ site_settings.tg_group_url or '' }}">
            <p class="text-[0.72rem] text-slate-500 mt-1.5">留空则不显示 TG 交流群按钮</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">普通用户默认邮箱数量</label>
                <input type="number" class="form-input" name="default_user_max_emails" value="{{ site_settings.default_user_max_emails }}" required min="1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">Pro 用户默认邮箱数量</label>
                <input type="number" class="form-input" name="default_pro_max_emails" value="{{ site_settings.default_pro_max_emails }}" required min="1">
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">普通用户邮箱前缀最少字符数</label>
                <input type="number" class="form-input" name="min_user_prefix_length" value="{{ site_settings.min_user_prefix_length }}" required min="1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">Pro 用户邮箱前缀最少字符数</label>
                <input type="number" class="form-input" name="min_pro_prefix_length" value="{{ site_settings.min_pro_prefix_length }}" required min="1">
            </div>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-floppy-disk"></i>保存设置
        </button>
    </form>
</div>

<div data-aos="fade-up" data-aos-delay="80" class="glass-card rounded-3xl p-6 md:p-8">
    <h2 class="section-title mb-6">
        <span class="icon-tile !w-8 !h-8 !rounded-lg bg-cyan-500/15 border-cyan-400/25 text-cyan-300 text-xs"><i class="fas fa-envelope"></i></span>
        邮件服务器设置
    </h2>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">SMTP 服务器</label>
            <input type="text" class="form-input" name="smtp_server" value="{{ site_settings.smtp_server }}" required>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">IMAP 服务器</label>
            <input type="text" class="form-input" name="imap_server" value="{{ site_settings.imap_server }}" required>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">POP3 服务器</label>
            <input type="text" class="form-input" name="pop3_server" value="{{ site_settings.pop3_server }}" required>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">网页版邮箱链接</label>
            <input type="text" class="form-input" name="webmail_url" value="{{ site_settings.webmail_url }}" required>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-floppy-disk"></i>保存设置
        </button>
    </form>
</div>
{% endblock %}
