{% extends "admin/base.html" %}

{% block title %}关于页面 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card card-line rounded-3xl p-6 md:p-7 mb-6">
    <div class="flex items-center gap-3.5">
        <span class="icon-tile !w-11 !h-11 !rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600">
            <i class="fas fa-file-lines"></i>
        </span>
        <div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">关于页面管理</h1>
            <p class="text-xs text-slate-500 mt-0.5">编辑关于我们的内容</p>
        </div>
    </div>
</div>

<div data-aos="fade-up" class="glass-card rounded-3xl p-6 md:p-8">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-5">
            <label class="block text-xs font-semibold text-slate-300 mb-2">关于页面内容（支持 HTML）</label>
            <textarea class="form-textarea font-mono text-sm" name="content" rows="15" required>{{ about_page.content }}</textarea>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-floppy-disk"></i>保存
        </button>
    </form>
</div>
{% endblock %}
