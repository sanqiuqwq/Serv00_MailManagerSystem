{% extends "admin/base.html" %}

{% block title %}关于页面 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card rounded-3xl p-8 mb-6">
    <h1 class="text-3xl font-bold text-slate-800 mb-2 flex items-center gap-3">
        <i class="fas fa-file-alt text-cyan-600"></i>关于页面管理
    </h1>
    <p class="text-slate-600">编辑关于我们的内容</p>
</div>

<div data-aos="fade-up" class="glass-card rounded-3xl p-8">
    <form method="POST">
        <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-700 mb-2">关于页面内容</label>
            <textarea class="form-textarea" name="content" rows="15" required>{{ about_page.content }}</textarea>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-save"></i>保存
        </button>
    </form>
</div>
{% endblock %}
