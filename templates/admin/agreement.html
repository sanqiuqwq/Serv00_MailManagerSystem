{% extends "admin/base.html" %}

{% block title %}用户协议 - {{ site_settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="glass-card rounded-3xl p-8 mb-6">
    <h1 class="text-3xl font-bold text-slate-800 mb-2 flex items-center gap-3">
        <i class="fas fa-file-contract text-amber-600"></i>用户协议管理
    </h1>
    <p class="text-slate-600">编辑用户协议内容</p>
</div>

<div data-aos="fade-up" class="glass-card rounded-3xl p-8">
    <form method="POST">
        <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-700 mb-2">用户协议内容</label>
            <textarea class="form-textarea" name="content" rows="15" required>{{ user_agreement.content }}</textarea>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-save"></i>保存
        </button>
    </form>
</div>
{% endblock %}
