{% extends "base.html" %}

{% block title %}创建工单 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-2xl mx-auto">
    <div class="glass-card card-line spotlight rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="icon-tile !w-14 !h-14 !rounded-2xl mx-auto mb-5 bg-gradient-to-br from-emerald-500 to-teal-600 text-xl">
                <i class="fas fa-plus"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">创建工单</h1>
            <p class="text-sm text-slate-400">描述你的问题，我们将尽快回复</p>
        </div>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">工单标题</label>
                <input type="text" class="form-input" name="title" required placeholder="简要描述你的问题">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">详细内容</label>
                <textarea class="form-textarea" name="content" rows="8" required placeholder="请详细描述你遇到的问题或需求..."></textarea>
            </div>

            <button type="submit" class="btn-success w-full !py-3">
                <i class="fas fa-paper-plane"></i>提交工单
            </button>
        </form>
    </div>
</div>
{% endblock %}
