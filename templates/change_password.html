{% extends "base.html" %}

{% block title %}修改密码 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card card-line spotlight rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="icon-tile !w-14 !h-14 !rounded-2xl mx-auto mb-5 bg-gradient-to-br from-amber-400 to-orange-600 text-xl">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">修改密码</h1>
            <p class="text-sm text-slate-400">更新你的账户密码</p>
        </div>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">原密码</label>
                <input type="password" class="form-input" name="old_password" required placeholder="请输入原密码">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">新密码</label>
                <input type="password" class="form-input" name="new_password" required placeholder="请输入新密码">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">确认新密码</label>
                <input type="password" class="form-input" name="confirm_password" required placeholder="请再次输入新密码">
            </div>

            <button type="submit" class="btn-warning w-full !py-3">
                <i class="fas fa-floppy-disk"></i>修改密码
            </button>
        </form>
    </div>
</div>
{% endblock %}
