{% extends "base.html" %}

{% block title %}重置密码 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card rounded-3xl p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-3xl">
                <i class="fas fa-unlock-alt"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">重置密码</h1>
            <p class="text-slate-600">设置你的新密码</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-lock mr-2 text-indigo-600"></i>新密码
                </label>
                <input type="password" class="form-input" name="password" required placeholder="请输入新密码">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-lock mr-2 text-indigo-600"></i>确认新密码
                </label>
                <input type="password" class="form-input" name="confirm_password" required placeholder="请再次输入新密码">
            </div>

            {% if recaptcha_enabled and recaptcha_site_key %}
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
            </div>
            {% endif %}
            
            <button type="submit" class="btn-primary w-full text-base">
                <i class="fas fa-save"></i>重置密码
            </button>
        </form>
    </div>
</div>
{% endblock %}
