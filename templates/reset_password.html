{% extends "base.html" %}

{% block title %}重置密码 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card card-line spotlight rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="icon-tile !w-14 !h-14 !rounded-2xl mx-auto mb-5 bg-gradient-to-br from-indigo-500 to-violet-600 text-xl">
                <i class="fas fa-unlock"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">重置密码</h1>
            <p class="text-sm text-slate-400">设置你的新密码</p>
        </div>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">新密码</label>
                <input type="password" class="form-input" name="password" required placeholder="请输入新密码">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">确认新密码</label>
                <input type="password" class="form-input" name="confirm_password" required placeholder="请再次输入新密码">
            </div>

            {% if recaptcha_enabled and recaptcha_site_key %}
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
            </div>
            {% endif %}

            <button type="submit" class="btn-primary w-full !py-3">
                <i class="fas fa-floppy-disk"></i>重置密码
            </button>
        </form>
    </div>
</div>
{% endblock %}
