{% extends "base.html" %}

{% block title %}注册 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card card-line spotlight rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="icon-tile !w-14 !h-14 !rounded-2xl mx-auto mb-5 bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-500 text-xl">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">创建账户</h1>
            <p class="text-sm text-slate-400">开启你的邮箱之旅</p>
        </div>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">用户名</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" class="form-input !pl-10" name="username" required placeholder="请输入用户名">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">邮箱地址</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="email" class="form-input !pl-10" name="email" required placeholder="your@email.com">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">密码</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="password" class="form-input !pl-10" name="password" required placeholder="请输入密码">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">确认密码</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="password" class="form-input !pl-10" name="confirm_password" required placeholder="再次输入密码">
                </div>
            </div>

            {% if recaptcha_enabled and recaptcha_site_key %}
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
            </div>
            {% endif %}

            <div class="flex items-start gap-3 tile p-3">
                <input type="checkbox" id="agree_terms" name="agree_terms" required class="mt-0.5 w-4 h-4 rounded accent-indigo-500">
                <label for="agree_terms" class="text-xs text-slate-400 leading-relaxed">
                    我已阅读并同意 <a href="{{ url_for('agreement') }}" target="_blank" class="text-indigo-300 hover:text-white font-medium transition">用户协议</a>
                </label>
            </div>

            <button type="submit" class="btn-success w-full !py-3">
                <i class="fas fa-user-plus"></i>注册账户
            </button>
        </form>

        <div class="mt-7 pt-6 border-t border-white/10 text-center">
            <p class="text-sm text-slate-500">
                已有账户？
                <a href="{{ url_for('login') }}" class="text-indigo-300 hover:text-white font-semibold transition">立即登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
