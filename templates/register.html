{% extends "base.html" %}

{% block title %}注册 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div data-aos="fade-up" class="max-w-md mx-auto">
    <div class="glass-card rounded-3xl p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-3xl">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">创建账户</h1>
            <p class="text-slate-600">开启你的邮箱之旅</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-user mr-2 text-emerald-600"></i>用户名
                </label>
                <input type="text" class="form-input" name="username" required placeholder="请输入用户名">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-envelope mr-2 text-emerald-600"></i>邮箱地址
                </label>
                <input type="email" class="form-input" name="email" required placeholder="your@email.com">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-lock mr-2 text-emerald-600"></i>密码
                </label>
                <input type="password" class="form-input" name="password" required placeholder="请输入密码">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fas fa-lock mr-2 text-emerald-600"></i>确认密码
                </label>
                <input type="password" class="form-input" name="confirm_password" required placeholder="再次输入密码">
            </div>

            {% if recaptcha_enabled and recaptcha_site_key %}
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
            </div>
            {% endif %}

            <div class="flex items-start gap-3">
                <input type="checkbox" id="agree_terms" name="agree_terms" required class="mt-1 w-5 h-5 rounded accent-indigo-600">
                <label for="agree_terms" class="text-sm text-slate-600">
                    我已阅读并同意 <a href="{{ url_for('agreement') }}" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-medium">用户协议</a>
                </label>
            </div>
            
            <button type="submit" class="btn-success w-full text-base">
                <i class="fas fa-user-plus"></i>注册账户
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-600">
                已有账户？
                <a href="{{ url_for('login') }}" class="text-indigo-600 hover:text-indigo-800 font-semibold">立即登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
